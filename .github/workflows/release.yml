name: release
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Bundle xk6 extensions
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build
        id: build
        uses: szkiba/xk6bundler@fdee404b4c423a222b4d5a301d78719469294faf # v0.1.7
        with:
          with: github.com/grafana/xk6-python=/github/workspace
          k6_version: v1.1.0

      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: dist/*.tar.gz
